  <!-- Main identity -->
  <g font-family="monospace">
    <text x="66" y="65" fill="#5EF5A8" font-size="12" letter-spacing="3.8">PORTFOLIO / 2026</text>
    <path d="M66 83H110" stroke="#48F5A2" stroke-width="3"/>

    <text x="62" y="164" fill="#F0F7F2" font-size="59" font-weight="700" letter-spacing="-2.8">BASHIR ALI</text>
    <text x="66" y="204" fill="#69EBA9" font-size="17" letter-spacing="2.5">COMPUTER SCIENCE STUDENT</text>

    <text x="66" y="251" fill="#A7B9AE" font-size="14">Exploring systems, security &amp; intelligent technology.</text>

    <rect x="66" y="286" width="304" height="36" rx="5" fill="#12241A" stroke="#2D6B4A"/>
