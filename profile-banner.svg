  <ellipse cx="930" cy="215" rx="250" ry="170" fill="#21D981" fill-opacity=".09" filter="url(#blur)"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" stroke="#55ECA0" stroke-opacity=".24"/>

