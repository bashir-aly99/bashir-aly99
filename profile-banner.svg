
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B0A"/>
      <stop offset=".58" stop-color="#0B1210"/>
      <stop offset="1" stop-color="#101D17"/>
    </linearGradient>
    <linearGradient id="glow" x1="720" y1="50" x2="1150" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36F5A0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#36F5A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#48F5A2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#48F5A2" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8AFFC0" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
